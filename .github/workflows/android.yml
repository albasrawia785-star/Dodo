name: Build Android APK with Persistent Signing

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. سحب الكود من المستودع
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. تنظيف الإعدادات المتعارضة السابقة
      - name: Pre-Clean Conflicting Configurations
        run: |
          rm -rf capacitor.config.ts capacitor.config.json

      # 3. فك ضغط ملفات المشروع في حال وجود ملف zip
      - name: Unzip Project Files If Needed
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            unzip *.zip -d temp_unzip 2>/dev/null || true
            TARGET_DIR=$(find temp_unzip -name "package.json" -exec dirname {} \; | head -n 1)
            if [ -n "$TARGET_DIR" ]; then
              echo "Found project files in: $TARGET_DIR"
              cp -r $TARGET_DIR/* .
            fi
            rm -rf temp_unzip
          fi

      # 4. إعداد بيئة Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 5. تثبيت حزم وباقات Node
      - name: Install Dependencies
        run: npm install --force

      # 6. بناء تطبيق React لإنتاج ملفات dist
      - name: Build Web Application
        run: npm run build

      # 7. تثبيت إضافة Capacitor الخاصة بنظام أندرويد
      - name: Install Native Capacitor Plugins
        run: |
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest @capacitor/filesystem@latest @capacitor/share@latest @capacitor/splash-screen@latest @capacitor/haptics@latest @capacitor-community/sqlite@latest

      # 8. تحويل React إلى مشروع أندرويد
      - name: Initialize Capacitor Android
        run: |
          APP_NAME="دفتر الديون"
          PACKAGE_ID="com.daftar.aldeyon"
          npx cap init "$APP_NAME" "$PACKAGE_ID" --web-dir=dist
          npx cap add android
          npx cap sync android

      # 9. إعداد بيئة Java 21 لتتوافق مع متطلبات Capacitor
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # 10. بناء وتوقيع ملف الـ APK المباشر عبر Gradle
      - name: Build and Sign Release APK via Gradle
        run: |
          cd android
          chmod +x gradlew

          # استخدام المفتاح الثابت المرفق في المشروع
          if [ -f "../daftar_release.keystore" ]; then
            cp ../daftar_release.keystore release.keystore
            echo "✅ تم العثور على المفتاح الثابت: daftar_release.keystore"
          elif [ -f "../release.keystore" ]; then
            cp ../release.keystore release.keystore
            echo "✅ تم العثور على المفتاح الثابت: release.keystore"
          else
            echo "⚠️ لم يتم العثور على مفتاح ثابت، جاري إنشاء مفتاح جديد..."
            keytool -genkeypair -v -keystore release.keystore -alias daftar_key -keyalg RSA -keysize 2048 -validity 10000 -storepass "DaftarPass2026" -keypass "DaftarPass2026" -dname "CN=Daftar, OU=Dev, O=Daftar, L=Basra, C=IQ" -storetype PKCS12
          fi

          # كتابة بيانات التوقيع داخل gradle.properties
          echo "MYAPP_RELEASE_STORE_FILE=release.keystore" >> gradle.properties
          echo "MYAPP_RELEASE_STORE_PASSWORD=DaftarPass2026" >> gradle.properties
          echo "MYAPP_RELEASE_KEY_ALIAS=daftar_key" >> gradle.properties
          echo "MYAPP_RELEASE_KEY_PASSWORD=DaftarPass2026" >> gradle.properties

          RUN_NUM=${{ github.run_number }}
          DATE_STR=$(date +'%Y-%m-%d')
          FINAL_APK_NAME="Daftar-Aldeyon-${DATE_STR}-v${RUN_NUM}.apk"

          # تنفيذ البناء وتوليد التوقيع ببروتوكولات أندرويد V1 و V2 المعتمدة
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/release.keystore \
            -Pandroid.injected.signing.store.password=DaftarPass2026 \
            -Pandroid.injected.signing.key.alias=daftar_key \
            -Pandroid.injected.signing.key.password=DaftarPass2026 \
            -Pandroid.injected.signing.v1-signing-enabled=true \
            -Pandroid.injected.signing.v2-signing-enabled=true \
            --no-daemon

          # تجهيز الملف النهائي ونقله لمسار المخرجات
          mkdir -p app/build/outputs/apk/release/final/
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/final/${FINAL_APK_NAME}

      # 11. رفع ملف الـ APK النظيف والجاهز للتحميل
      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Daftar-Aldeyon-APK
          path: android/app/build/outputs/apk/release/final/*.apk
