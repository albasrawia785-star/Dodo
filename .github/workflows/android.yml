name: Build Online Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. سحب الكود من المستودع
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. إعداد بيئة جافا (JDK 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      # 3. فك ضغط الملف المضغوط في مجلد مخصص
      - name: Extract Project Zip
        run: |
          mkdir -p extracted_project
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "📦 تم العثور على الملف المضغوط: $ZIP_FILE، جاري فك الضغط..."
            unzip -o "$ZIP_FILE" -d extracted_project
          else
            echo "📁 لم يتم العثور على ملف ZIP، سيتم النسخ المباشر..."
            cp -r . extracted_project/ 2>/dev/null || true
          fi

      # 4. بناء وتوقيع ملف الـ Release APK
      - name: Build and Sign Release APK
        env:
          _JAVA_OPTIONS: "-Djava.awt.headless=true"
          GRADLE_OPTS: "-Djava.awt.headless=true -Dorg.gradle.jvmargs=-Xmx2048m"
        run: |
          # البحث عن ملفات إعدادات أندرويد داخل المجلد المفكوك
          SETTINGS_FILE=$(find extracted_project -name "settings.gradle.kts" -o -name "settings.gradle" -o -name "build.gradle*" | head -n 1)
          
          if [ -z "$SETTINGS_FILE" ]; then
            echo "❌ خطأ: لم يتم العثور على ملفات مشروع أندرويد داخل الأرشيف المضغوط!"
            exit 1
          fi

          # تحديد المجلد الرئيسي للمشروع
          TARGET_DIR=$(dirname "$SETTINGS_FILE")
          if [ "$(basename "$TARGET_DIR")" = "app" ]; then
            TARGET_DIR=$(dirname "$TARGET_DIR")
          fi

          echo "📁 تم العثور على مشروع أندرويد في المسار: $TARGET_DIR"
          cd "$TARGET_DIR"

          echo "🛠️ 1. تجهيز Gradle Wrapper وتصاريح التشغيل..."
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew

          echo "🔍 2. البحث عن مفتاح التوقيع (Keystore)..."
          KEYSTORE_PATH=$(find . -name "*.jks" -o -name "*.keystore" | head -n 1)
          if [ -z "$KEYSTORE_PATH" ]; then
            echo "⚠️ لم يتم العثور على مفتاح جاهز، جاري إنشاء مفتاح افتراضي..."
            keytool -genkey -v -keystore my-upload-key.jks \
              -alias key0 -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "android" -keypass "android" \
              -dname "CN=Online App, OU=Dev, O=App, L=Basra, C=IQ"
            KEYSTORE_PATH="my-upload-key.jks"
          else
            echo "🔑 تم العثور على الملف: $KEYSTORE_PATH"
          fi

          echo "🛠️ 3. إنشاء ملف google-services.json..."
          mkdir -p app
          cat <<EOF > app/google-services.json
          {
            "project_info": {
              "project_number": "123456789",
              "project_id": "debt-tracker-online"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789:android:123456",
                  "android_client_info": {
                    "package_name": "com.aistudio.debttracker.iqdb"
                  }
                },
                "api_key": [
                  {
                    "current_key": "mock_api_key_here"
                  }
                ]
              }
            ]
          }
          EOF

          echo "🚀 4. بدء بناء نسخة الـ Release الموقعة..."
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/$KEYSTORE_PATH \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=key0 \
            -Pandroid.injected.signing.key.password=android \
            --no-daemon --stacktrace

          echo "✅ تم البناء والتوقيع بنجاح!"

      # 5. رفع ملف الـ APK النهائي
      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: DebtTracker-Online-Release-APK
          path: "extracted_project/**/build/outputs/apk/release/*.apk"
