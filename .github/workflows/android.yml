name: Build Web App to Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. سحب الكود من المستودع
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. إعداد بيئة Node.js و Java (JDK 21)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      # 3. فك ضغط مشروع الويب
      - name: Extract Project Zip
        run: |
          mkdir -p extracted_project
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "📦 جاري فك ضغط ملف المشروع..."
            unzip -o "$ZIP_FILE" -d extracted_project
          else
            cp -r . extracted_project/ 2>/dev/null || true
          fi

      # 4. تثبيت الحزم وبناء تطبيق الويب (Vite Build)
      - name: Install Dependencies & Build Web Project
        run: |
          cd extracted_project
          npm install
          npm run build || npx vite build

      # 5. إعداد وتغليف أندرويد وتكافؤ التبعيات
      - name: Setup Android Platform & Fix Duplicate Classes
        run: |
          cd extracted_project
          
          # إضافة إطار عمل أندرويد إن لم يكن موجوداً
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "DebtTracker" "com.aistudio.debttracker" --web-dir dist || true
          npx cap add android || true
          npx cap sync android

          # إصلاح تعارض كلاسات Kotlin المكررة في Gradle
          cat << 'EOF' >> android/build.gradle

          subprojects {
              configurations.all {
                  resolutionStrategy {
                      exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                      exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
                  }
              }
          }
          EOF

          # الانتقال لمجلد أندرويد وإعطاء الصلاحيات
          cd android
          chmod +x gradlew

          # البحث عن ملف الـ Keystore الخاص بك
          KEYSTORE_PATH=$(find .. -name "daftar_release.keystore" -o -name "*.keystore" -o -name "*.jks" | head -n 1)
          
          if [ -n "$KEYSTORE_PATH" ]; then
            echo "🔑 تم استخدام مفتاح التوقيع الخاص بك: $KEYSTORE_PATH"
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=$(pwd)/$KEYSTORE_PATH \
              -Pandroid.injected.signing.store.password=android \
              -Pandroid.injected.signing.key.alias=key0 \
              -Pandroid.injected.signing.key.password=android \
              --no-daemon
          else
            ./gradlew assembleRelease --no-daemon
          fi

      # 6. رفع ملف الـ APK الناتجة
      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: DebtTracker-Release-APK
          path: "extracted_project/android/app/build/outputs/apk/release/*.apk"
