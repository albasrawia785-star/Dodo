name: Build Web App to Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. سحب الكود من المستودع
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. إعداد بيئة Node.js و Java (JDK 21)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      # 3. فك ضغط مشروع الويب
      - name: Extract Project Zip
        run: |
          mkdir -p extracted_project
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "📦 جاري فك ضغط ملف المشروع..."
            unzip -o "$ZIP_FILE" -d extracted_project
          else
            cp -r . extracted_project/ 2>/dev/null || true
          fi

      # 4. تثبيت الحزم وبناء مشروع الويب
      - name: Install Dependencies & Build Web Project
        run: |
          cd extracted_project
          npm install
          npm run build || npx vite build

      # 5. إعداد أندرويد وبناء ملف APK غير موقع ثم توقيعه بمفتاح جديد
      - name: Setup Android Platform & Build APK
        run: |
          cd extracted_project
          
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "DebtTracker" "com.aistudio.debttracker" --web-dir dist || true
          npx cap add android || true
          npx cap sync android

          # حل تعارض مكتبات Kotlin
          cat << 'EOF' >> android/build.gradle

          subprojects {
              configurations.all {
                  resolutionStrategy {
                      exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                      exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
                  }
              }
          }
          EOF

          # إنشاء مفتاح توقيع جديد بكلمة سر معروفة
          keytool -genkey -v -keystore auto_generated.keystore -storepass android -alias key0 -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android, OU=Dev, O=App, L=City, S=State, C=US"

          cd android
          chmod +x gradlew

          # البناء مع التوقيع بالمفتاح الجديد
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/../auto_generated.keystore \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=key0 \
            -Pandroid.injected.signing.key.password=android \
            --no-daemon

      # 6. رفع ملف الـ APK
      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: DebtTracker-Release-APK
          path: "extracted_project/android/app/build/outputs/apk/release/*.apk"
