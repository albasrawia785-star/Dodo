name: Android CI/CD - Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. جلب الكود من المستودع
    - name: Checkout the code
      uses: actions/checkout@v4

    # 2. إعداد بيئة جافا
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    # 3. إعداد أداة Gradle الرسمية
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    # 4. الانتقال الذكي لمجلد المشروع الحقيقي وبناء الـ APK
    - name: Build Debug APK
      run: |
        # البحث عن المجلد الذي يحتوي على إعدادات الـ gradle والدخول إليه
        SETTINGS_PATH=$(find . -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)
        if [ -z "$SETTINGS_PATH" ]; then
          echo "Error: Android project configuration (settings.gradle) not found!"
          exit 1
        fi
        PROJECT_DIR=$(dirname "$SETTINGS_PATH")
        echo "Found Android project in: $PROJECT_DIR"
        cd $PROJECT_DIR
        gradle assembleDebug

    # 5. رفع ملف الـ APK الناتج كـ Artifact (يبحث في كل المجلدات)
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: pharmacy-app-debug-apk
        path: |
          **/build/outputs/apk/debug/*-debug.apk
