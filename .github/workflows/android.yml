name: Build Online Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. سحب الكود من المستودع
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. إعداد بيئة جافا (JDK 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      # 3. فك ضغط ملف المشروع (في حال تم رفعه كـ ZIP)
      - name: Extract Project Zip (If Exists)
        run: |
          mkdir -p project_dir
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "📦 تم العثور على ملف مضغوط: $ZIP_FILE، جاري فك الضغط..."
            unzip -o "$ZIP_FILE" -d project_dir
          else
            echo "📁 لم يتم العثور على ملفات ZIP، سيتم استخدام الكود الموجود في المستودع مباشرة."
            cp -r . project_dir 2>/dev/null || true
          fi

      # 4. بناء وتوقيع ملف الـ Release APK
      - name: Build and Sign Release APK
        env:
          _JAVA_OPTIONS: "-Djava.awt.headless=true"
          GRADLE_OPTS: "-Djava.awt.headless=true -Dorg.gradle.jvmargs=-Xmx2048m"
        run: |
          # البحث عن مجلد إعدادات أندرويد الأساسي
          TARGET_DIR=$(find project_dir -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1 | xargs dirname)
          if [ -z "$TARGET_DIR" ]; then
            echo "❌ خطأ: لم يتم العثور على ملفات مشروع أندرويد (settings.gradle)!"
            exit 1
          fi
          cd "$TARGET_DIR"
          
          echo "🛠️ 1. تجهيز الـ Gradle Wrapper وتصاريح التشغيل..."
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew

          echo "🛠️ 2. إنشاء مفتاح التوقيع الرقمي (Keystore)..."
          keytool -genkey -v -keystore my-upload-key.jks \
            -alias key0 \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "android" \
            -keypass "android" \
            -dname "CN=Online App, OU=Dev, O=App, L=Basra, C=IQ"

          echo "🛠️ 3. كتابة خواص التوقيع في ملف gradle.properties..."
          echo "MYAPP_RELEASE_STORE_FILE=my-upload-key.jks" >> gradle.properties
          echo "MYAPP_RELEASE_STORE_PASSWORD=android" >> gradle.properties
          echo "MYAPP_RELEASE_KEY_ALIAS=key0" >> gradle.properties
          echo "MYAPP_RELEASE_KEY_PASSWORD=android" >> gradle.properties

          echo "🛠️ 4. إنشاء ملف google-services.json تلقائياً..."
          mkdir -p app
          cat <<EOF > app/google-services.json
          {
            "project_info": {
              "project_number": "123456789",
              "project_id": "debt-tracker-online"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789:android:123456",
                  "android_client_info": {
                    "package_name": "com.aistudio.debttracker.iqdb"
                  }
                },
                "api_key": [
                  {
                    "current_key": "mock_api_key_here"
                  }
                ]
              }
            ]
          }
          EOF

          echo "🚀 5. تنفيذ بناء نسخة الـ Release الموقعة..."
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/my-upload-key.jks \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=key0 \
            -Pandroid.injected.signing.key.password=android \
            --no-daemon --stacktrace

          echo "✅ تم البناء والتوقيع بنجاح!"

      # 5. رفع ملف الـ APK النهائي كـ Artifact قابل للتنزيل
      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: DebtTracker-Online-Release-APK
          path: project_dir/**/build/outputs/apk/release/*.apk
