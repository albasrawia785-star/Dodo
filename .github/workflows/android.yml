name: Android CI/CD - Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. جلب الك code من المستودع
    - name: Checkout the code
      uses: actions/checkout@v4

    # 2. إعداد بيئة جافا
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    # 3. إعداد أداة Gradle الرسمية داخل السيرفر تلقائياً
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    # 4. بناء التطبيق باستخدام أمر غردل العام (دون الحاجة لملف gradlew)
    - name: Build Debug APK
      run: gradle assembleDebug

    # 5. رفع ملف الـ APK الناتج كـ Artifact
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: pharmacy-app-debug-apk
        path: |
          **/build/outputs/apk/debug/*-debug.apk
