name: Android CI/CD - Build APK

# سيعمل هذا السكريبت تلقائياً عند عمل Push أو Pull Request على فرع main أو master
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. جلب الكود من المستودع
    - name: Checkout the code
      uses: actions/checkout@v4

    # 2. إعداد بيئة جافا (Java JDK 17 وهي المتوافقة مع أحدث إصدارات أندرويد ستوديو)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'
        cache: gradle

    # 3. إعطاء صلاحيات التنفيذ لملف Gradle الصلاحيات اللازمة للبناء
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 4. بناء نسخة الـ APK (Debug) المخصصة للتجربة
    - name: Build Debug APK
      run: ./gradlew assembleDebug

    # 5. رفع ملف الـ APK الناتج كـ Artifact لتتمكن من تحميله من موقع GitHub
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: pharmacy-app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
