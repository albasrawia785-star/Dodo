name: Android CI/CD - Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. جلب الكود من المستودع
    - name: Checkout the code
      uses: actions/checkout@v4

    # 2. إعداد بيئة جافا (تم تعطيل الكاش التلقائي لتجنب خطأ المسار)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    # 3. إعطاء صلاحيات التنفيذ لملف Gradle (البحث في جميع المجلدات)
    - name: Grant execute permission for gradlew
      run: find . -name "gradlew" -exec chmod +x {} \;

    # 4. البحث التلقائي عن ملف gradlew وبناء التطبيق أينما كان مكانه
    - name: Build Debug APK
      run: |
        GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
        if [ -z "$GRADLEW_PATH" ]; then
          echo "Error: gradlew not found in repository!"
          exit 1
        fi
        cd $(dirname "$GRADLEW_PATH")
        ./gradlew assembleDebug

    # 5. رفع ملف الـ APK الناتج كـ Artifact
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: pharmacy-app-debug-apk
        path: |
          **/build/outputs/apk/debug/*-debug.apk
